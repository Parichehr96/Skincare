<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Survey Results Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: sticky top bar, KPI row, live feed, one filter row, then a grid of per-question bar charts. */
:root {
  --bg: #ffffff; --panel: #f5f9f7; --ink: #1f2d35; --muted: #5b6b73; --faint: #8a979e; --line: #dde6ea;
  --accent: #2c7a6a; --bar: #14907a; --bar-track: #eef3f1; --blue-soft: #e1eefb; --green-soft: #e1f3ea; --new: #fff6d9;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.top { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
.top h1 { font-size: 22px; flex: 1; min-width: 200px; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bar); box-shadow: 0 0 0 0 rgba(20,144,122,.5); animation: ping 2s infinite; }
.dot.off { background: var(--faint); animation: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(20,144,122,.45); } 70% { box-shadow: 0 0 0 9px rgba(20,144,122,0); } 100% { box-shadow: 0 0 0 0 rgba(20,144,122,0); } }
.btn { min-height: 40px; padding: 0 16px; border-radius: 99px; border: 1.5px solid var(--line); background: #fff; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.gate { max-width: 420px; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 14px; padding: 0 16px; }
.gate h1 { font-size: 30px; }
.gate p { margin: 0; color: var(--muted); }
.gate input { min-height: 50px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 14px; font-size: 16px; }
.gate input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--green-soft); }
.err { color: #9a5a12; font-weight: 700; min-height: 1em; margin: 0; }

section { margin-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 20px; }
.sub { color: var(--muted); font-size: 14px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .k { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.kpi .v { font-family: var(--f-display); font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .n { font-size: 13px; color: var(--muted); }

.feed { display: flex; flex-direction: column; gap: 8px; }
.row { border: 1.5px solid var(--line); border-radius: 16px; background: #fff; transition: background-color 1.2s; }
.row.fresh { background: var(--new); }
.row summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; }
.row summary::-webkit-details-marker { display: none; }
.when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.who { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.tag { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--panel); white-space: nowrap; }
.tag.b { background: var(--blue-soft); }
.tag.g { background: var(--green-soft); }
.dur { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.answers { margin: 0; padding: 4px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 24px; }
.answers div { display: flex; flex-direction: column; font-size: 14px; }
.answers dt { color: var(--muted); font-size: 12px; }
.answers dd { margin: 0; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border-radius: 18px; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; background: var(--panel); border-radius: 18px; }
.filters label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 700; }
.filters select { min-height: 40px; min-width: 130px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 14px; color: var(--ink); font-weight: 400; }
.filters .count { margin-left: auto; font-size: 14px; color: var(--muted); }

.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; transition: opacity .2s; }
.charts.loading { opacity: .55; }
.card { border: 1.5px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { font-size: 17px; line-height: 1.3; }
.card .meta { font-size: 13px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) 74px; gap: 10px; align-items: center; padding: 4px 6px; margin: 0 -6px; border-radius: 10px; cursor: default; }
.bar:hover, .bar:focus-visible { background: var(--panel); }
.bar .l { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.bar .l .sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; vertical-align: -2px; box-shadow: 0 0 0 1px var(--line); }
.bar .track { display: block; height: 14px; background: var(--bar-track); border-radius: 0 4px 4px 0; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.lead .l { font-weight: 700; }
.bar .val { font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
.bar .val b { font-weight: 700; }
.bar .val span { color: var(--muted); }
.signal { font-size: 13px; border-radius: 12px; padding: 10px 12px; background: var(--blue-soft); display: flex; gap: 8px; align-items: flex-start; }
.signal.met { background: #fff1cf; }
.signal svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
.signal b { font-weight: 700; }
.open { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; }
.open p { margin: 0; padding: 10px 12px; background: var(--panel); border-radius: 12px; font-size: 14px; overflow-wrap: anywhere; }
.open .m { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.wide { grid-column: 1 / -1; }

.panel { border: 1.5px solid var(--line); border-radius: 22px; }
.panel > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; }
.panel > summary::-webkit-details-marker { display: none; }
.panel > summary > span:first-child { display: flex; flex-direction: column; gap: 2px; }
.panel > summary h2 { font-size: 20px; }
.chev { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--panel); position: relative; }
.chev::before { content: ""; position: absolute; left: 14px; top: 12px; width: 10px; height: 10px; border-right: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: rotate(45deg); transition: transform .2s; }
.panel[open] .chev::before { transform: translate(0, 5px) rotate(-135deg); }
.panel-body { padding: 0 20px 20px; }
.ins-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.conf { font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 99px; background: var(--panel); }
.conf.signal { background: var(--blue-soft); }
.conf.solid { background: var(--green-soft); }
.summary { background: var(--green-soft); border-radius: 22px; padding: 20px 22px; }
.summary h3 { font-size: 19px; margin-bottom: 10px; }
.summary ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.summary li { font-size: 16px; line-height: 1.45; }
.summary .act { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.summary p { margin: 0; }
.notes { margin-top: 14px; border: 1.5px solid #f0d9a6; background: #fffaf0; border-radius: 18px; padding: 16px 20px; }
.notes h3 { font-size: 16px; margin-bottom: 6px; }
.notes ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
h3.area { font-size: 17px; margin: 26px 0 10px; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.dcard { border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; }
.pill svg { width: 14px; height: 14px; }
.pill.keep { background: var(--green-soft); color: #1f5f52; }
.pill.change { background: #fff1cf; color: #7a4a0e; }
.pill.watch { background: var(--panel); color: var(--muted); }
.dcard.watch { opacity: .75; }
.dn { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dcard h4 { margin: 0; font-family: var(--f-display); font-size: 16px; font-weight: 650; }
.hl { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; }
.ev { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; }
.next { margin: 4px 0 0; font-size: 14px; padding-top: 8px; border-top: 1px solid var(--line); }
.segs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.themes { display: flex; flex-wrap: wrap; gap: 8px; }
.theme { font-size: 14px; padding: 6px 12px; border-radius: 99px; background: var(--blue-soft); }
.theme b { font-variant-numeric: tabular-nums; margin-right: 4px; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 13px; max-width: 260px; opacity: 0; transition: opacity .12s; }
.tip b { font-size: 15px; }
.tip.on { opacity: 1; }
.foot { margin-top: 32px; font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .row summary { grid-template-columns: 70px minmax(0, 1fr); }
  .row summary .dur { display: none; }
  .answers { grid-template-columns: minmax(0, 1fr); }
  .bar { grid-template-columns: minmax(0, 1fr) 70px; }
  .bar .track { grid-column: 1 / -1; grid-row: 2; }
  .filters .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const QS = [{"id": "q1", "type": "single", "max": null, "title": "Which shade is closest to your skin?", "opts": [["t1", "Tone 1 (lightest)"], ["t2", "Tone 2"], ["t3", "Tone 3"], ["t4", "Tone 4"], ["t5", "Tone 5"], ["t6", "Tone 6"], ["t7", "Tone 7"], ["t8", "Tone 8 (deepest)"], ["na", "I'd rather not say"]]}, {"id": "q2", "type": "single", "max": null, "title": "How old are you?", "opts": [["18-24", "18–24"], ["25-34", "25–34"], ["35-44", "35–44"], ["45-54", "45–54"], ["55+", "55 or older"]]}, {"id": "q3", "type": "single", "max": null, "title": "How does your face usually feel by midday?", "opts": [["tight", "Tight or flaky"], ["shiny", "Shiny all over"], ["tzone", "Shiny T-zone"], ["comfy", "Comfortable"], ["unsure", "I don't know"]]}, {"id": "q4", "type": "single", "max": null, "title": "Which of these do you use on your face?", "opts": [["sunscreen", "Sunscreen"], ["moisturiser", "Moisturiser"], ["neither", "Neither"]]}, {"id": "q5", "type": "multi", "max": null, "title": "Where did you buy their product?", "opts": [["kruidvat", "Kruidvat"], ["etos", "Etos"], ["douglas", "Douglas"], ["hema", "HEMA"], ["action", "Action"], ["else", "Somewhere else"]]}, {"id": "q6", "type": "multi", "max": 2, "title": "How did you pick their product?", "opts": [["friend", "A friend or family member"], ["staff", "Shop staff"], ["social", "Social media"], ["reviews", "Online reviews"], ["pro", "A doctor or skin therapist"], ["offer", "It was on offer"]]}, {"id": "q7", "type": "single", "max": null, "title": "After how long could you tell whether their product works for you?", "opts": [["days", "A few days"], ["week", "About a week"], ["2-3w", "2–3 weeks"], ["4-6w", "4–6 weeks"], ["longer", "Longer than that"]]}, {"id": "q8", "type": "multi", "max": 3, "title": "What matters most when you choose a product?", "opts": [["price", "Low price"], ["nofrag", "Fragrance-free"], ["spf", "Has SPF"], ["light", "Light texture"], ["nocast", "No white cast"], ["makeup", "Works under makeup"], ["ingredients", "Ingredients"]]}, {"id": "q9", "type": "single", "max": null, "title": "How much do you usually spend on their product?", "opts": [["u10", "Under €10"], ["10-20", "€10–20"], ["20-35", "€20–35"], ["35+", "More than €35"]]}, {"id": "q10", "type": "single", "max": null, "title": "Which helps you more when choosing?", "opts": [["a", "A: “11 of 14 women like you would buy again”"], ["b", "B: “4.3 stars from 2,300 reviews”"], ["both", "Both together"], ["neither", "Neither"]]}, {"id": "q11", "type": "single", "max": null, "title": "Would you trust an AI chat to suggest a product for you?", "opts": [["yes", "Yes"], ["reviews", "Only if it shows reviews from real women"], ["no", "No"], ["unsure", "I'm not sure"]]}, {"id": "q12", "type": "single", "max": null, "title": "Would you share skin concerns, like spots or redness, to get better matches?", "opts": [["yes", "Yes"], ["maybe", "Maybe, if it's clear what happens with it"], ["no", "No"]]}, {"id": "q13", "type": "single", "max": null, "title": "How would this feel to you?", "opts": [["fair", "Fair"], ["explain", "Fair, if it explains why"], ["pushy", "A bit pushy"], ["stop", "I'd stop using it"]]}, {"id": "q14", "type": "single", "max": null, "title": "How many reviews from women with skin like yours would you need before you trust a product?", "opts": [["3", "3 or more"], ["5", "5 or more"], ["10", "10 or more"], ["20", "20 or more"], ["any", "The number doesn't matter"]]}, {"id": "q15", "type": "text", "max": null, "title": "If you could ask a skincare chat anything, what would you ask first?", "opts": []}];
const TONES = { t1: "#f6ede4", t2: "#f7ead0", t3: "#eadaba", t4: "#d7bd96", t5: "#a07e56", t6: "#825c43", t7: "#604134", t8: "#292420" };
const SIGNALS = {
  q1: "Under 25% at tones 5–8: recruit more women with deeper skin tones before trusting the white-cast results.",
  q3: "More than 20% pick “I don't know”: make the skin test the default.",
  q4: "One is chosen 3 times as often: build that category first.",
  q5: "A shop under 10%: drop it from launch.",
  q6: "Online reviews rarely picked: test in interviews whether reviews from women like her change that.",
  q7: "The most common answer becomes the first check-in.",
  q8: "The top 3 become the filter chips shown first.",
  q9: "Most spend under €20: fill the catalogue with drugstore products first.",
  q10: "Most pick B: show stars next to the score.",
  q11: "Under half pick Yes or “Only with reviews”: make the match list the home screen.",
  q12: "Most say no: drop the question at launch. Most say maybe: explain clearly what happens with it.",
  q13: "Over 30% say pushy or would stop: unlock after a delay instead.",
  q14: "The most common answer becomes the minimum review count.",
  q15: "Themes become chat starter chips and knowledge base entries."
};
const KEYSTORE = "skincare-results-key";
const MIN_N = 30;
let key = "", data = null, seen = new Set(), firstLoad = true, lastOk = 0, timer = 0, fails = 0;
const F = { range: "all", q2: "", q3: "", q4: "", lang: "", group: "" };
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const Q = Object.fromEntries(QS.map((q) => [q.id, q]));
const lab = (qid, v) => { const o = (Q[qid]?.opts || []).find((x) => x[0] === v); return o ? o[1] : v; };
const labs = (qid, v) => Array.isArray(v) ? v.map((x) => lab(qid, x)).join(", ") : lab(qid, v);
const rid = (r) => (r.receivedAt || "") + "|" + (r.durationSec ?? "") + "|" + (r.q1 || "") + (r.q2 || "") + (r.q3 || "");
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " " + new Date(iso).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
};
const mmss = (s) => s == null ? "–" : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

function gate(msg = "") {
  $("#app").innerHTML = `<form class="gate" id="gate">
    <h1>Survey results</h1>
    <p>Enter your results key to open the live panel. It's saved on this device only.</p>
    <label for="k" class="sub">Results key</label>
    <input id="k" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert">${esc(msg)}</p>
    <button class="btn primary" type="submit">Open results</button>
  </form>`;
  $("#gate").addEventListener("submit", (e) => { e.preventDefault(); key = $("#k").value.trim(); load(true); });
  $("#k").focus();
}

async function load(fromGate) {
  try {
    const r = await fetch(`/api/export?format=json&key=${encodeURIComponent(key)}`, { cache: "no-store" });
    if (r.status === 401) { try { localStorage.removeItem(KEYSTORE); } catch (e) {} clearInterval(timer); timer = 0; gate("That key isn't right. Check it and try again."); return; }
    if (!r.ok) throw new Error(r.status);
    const json = await r.json();
    try { localStorage.setItem(KEYSTORE, key); } catch (e) {}
    data = json; lastOk = Date.now(); fails = 0;
    if (!$("#main")) shell();
    renderAll();
    if (!timer) timer = setInterval(() => { if (document.visibilityState === "visible") load(); tickLive(); }, 15000);
  } catch (e) {
    fails++;
    if (fromGate) { const er = $("#err"); if (er) er.textContent = "Couldn't reach the results. Check your connection and try again."; }
    tickLive();
  }
}

function shell() {
  $("#app").innerHTML = `
  <header class="top"><div class="wrap">
    <h1>Survey results</h1>
    <span class="live" id="live"><span class="dot"></span><span id="liveTxt">Live</span></span>
    <a class="btn" id="csv" href="#">Download CSV</a>
    <button class="btn" id="forget" type="button">Lock</button>
  </div></header>
  <main class="wrap" id="main">
    <section><div class="kpis" id="kpis"></div></section>
    <section>
      <div class="sec-head"><h2>Latest answers</h2><span class="sub">Updates every 15 seconds. New answers flash yellow.</span></div>
      <div class="feed" id="feed"></div>
    </section>
    <section>
      <details class="panel" id="detail">
        <summary><span><h2>Detailed results</h2><span class="sub">Every question as a chart, with filters</span></span><span class="chev" aria-hidden="true"></span></summary>
        <div class="panel-body">
          <div class="filters" id="filters"></div>
          <div class="charts" id="charts" style="margin-top:16px"></div>
        </div>
      </details>
    </section>
    <section>
      <div class="sec-head"><h2>Analysis</h2><span class="sub">What the answers mean for the product, decision by decision.</span></div>
      <div id="insights"></div>
    </section>
    <p class="foot"><span>Percentages are of people who answered that question. On questions where people could pick several, they add up to more than 100%.</span><span>Signals turn on from ${MIN_N} answers.</span></p>
  </main>`;
  $("#csv").addEventListener("click", (e) => { e.preventDefault(); location.href = `/api/export?key=${encodeURIComponent(key)}`; });
  $("#forget").addEventListener("click", () => { try { localStorage.removeItem(KEYSTORE); } catch (e) {} clearInterval(timer); timer = 0; key = ""; data = null; seen = new Set(); firstLoad = true; gate(); });
  const det = $("#detail");
  try { det.open = localStorage.getItem("skincare-results-open") === "1"; } catch (e) {}
  det.addEventListener("toggle", () => { try { localStorage.setItem("skincare-results-open", det.open ? "1" : "0"); } catch (e) {} });
  $("#filters").addEventListener("change", (e) => { const n = e.target.name; if (n in F) { F[n] = e.target.value; renderAnalytics(); } });
}

function tickLive() {
  const t = $("#liveTxt"), d = $("#live .dot"); if (!t) return;
  const s = Math.round((Date.now() - lastOk) / 1000);
  const stale = fails > 1 || s > 60;
  d.classList.toggle("off", stale);
  t.textContent = stale ? `Offline · last update ${ago(new Date(lastOk).toISOString())}` : `Live · updated ${s < 5 ? "just now" : s + "s ago"}`;
}
setInterval(tickLive, 5000);

function renderAll() {
  const rows = (data.responses || []).slice().sort((a, b) => (b.receivedAt || "").localeCompare(a.receivedAt || ""));
  data.sorted = rows;
  renderKpis(rows); renderFeed(rows); renderFilters(rows); renderAnalytics(); renderInsights();
  rows.forEach((r) => seen.add(rid(r))); firstLoad = false; tickLive();
}

function renderKpis(rows) {
  const day = rows.filter((r) => Date.now() - new Date(r.receivedAt).getTime() < 864e5).length;
  const durs = rows.map((r) => r.durationSec).filter((x) => typeof x === "number" && x > 0 && x < 7200).sort((a, b) => a - b);
  const med = durs.length ? durs[Math.floor(durs.length / 2)] : null;
  const nl = rows.filter((r) => r.lang === "nl").length;
  const k = (label, v, n) => `<div class="kpi"><span class="k">${label}</span><span class="v">${v}</span><span class="n">${n}</span></div>`;
  $("#kpis").innerHTML =
    k("Responses", rows.length, rows.length >= 100 ? "Goal of 100 reached" : `${Math.max(0, 100 - rows.length)} to go to 100`) +
    k("Last 24 hours", day, rows[0] ? `Latest ${ago(rows[0].receivedAt)}` : "None yet") +
    k("Median time", mmss(med), med == null ? "No timings yet" : med <= 200 ? "On target (3 min)" : "Longer than 3 min") +
    k("In Dutch", rows.length ? pct(nl, rows.length) + "%" : "–", `${nl} of ${rows.length}`) +
    k("Sign-ups", data.contacts || 0, "Interview or results");
}

function renderFeed(rows) {
  const feed = $("#feed");
  if (!rows.length) { feed.innerHTML = `<div class="empty">No answers yet. As soon as someone finishes the survey, it appears here.</div>`; return; }

    const fresh = !firstLoad && !seen.has(rid(r));

      r.q2 ? `<span class="tag">${esc(lab("q2", r.q2))}</span>` : "",

    ].join("");

    return `<details class="row${fresh ? " fresh" : ""}"><summary><span class="when">${esc(ago(r.receivedAt))}</span><span class="who">${tags}</span><span class="dur">${mmss(r.durationSec)}</span></summary><dl class="answers">${ans}</dl></details>`;
  }).join("");
  setTimeout(() => feed.querySelectorAll(".fresh").forEach((el) => el.classList.remove("fresh")), 2500);

function renderFilters(rows) {
  const groups = [...new Set(rows.map((r) => r.group).filter(Boolean))].sort();
  const sel = (name, label, opts) => `<label>${label}<select name="${name}">${opts.map(([v, t]) => `<option value="${esc(v)}"${F[name] === v ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`;
  $("#filters").innerHTML =
    sel("range", "Date", [["all", "All time"], ["today", "Today"], ["7", "Last 7 days"], ["30", "Last 30 days"]]) +
    sel("q2", "Age", [["", "All ages"], ...Q.q2.opts]) +
    sel("q3", "Skin by midday", [["", "All skin types"], ...Q.q3.opts]) +
    sel("q4", "Product", [["", "Both products"], ...Q.q4.opts]) +
    sel("lang", "Language", [["", "Both"], ["en", "English"], ["nl", "Dutch"]]) +
    sel("group", "Group", [["", "All groups"], ...groups.map((g) => [g, g]), ...(rows.some((r) => !r.group) ? [["(none)", "No group code"]] : [])]) +
    `<span class="count" id="fcount"></span>`;
}

function filtered() {
  const rows = data.sorted || [];
  const now = Date.now(), start = new Date(); start.setHours(0, 0, 0, 0);
  return rows.filter((r) => {
    const t = new Date(r.receivedAt).getTime();
    if (F.range === "today" && t < start.getTime()) return false;
    if ((F.range === "7" || F.range === "30") && now - t > Number(F.range) * 864e5) return false;
    for (const k of ["q2", "q3", "q4", "lang"]) if (F[k] && r[k] !== F[k]) return false;
    if (F.group === "(none)" ? !!r.group : F.group && r.group !== F.group) return false;
    return true;
  });
}

function counts(rows, q) {
  const answered = rows.filter((r) => q.type === "multi" ? Array.isArray(r[q.id]) && r[q.id].length : r[q.id] != null && r[q.id] !== "");
  const c = Object.fromEntries(q.opts.map((o) => [o[0], 0]));
  answered.forEach((r) => (Array.isArray(r[q.id]) ? r[q.id] : [r[q.id]]).forEach((v) => { if (v in c) c[v]++; }));
  return { n: answered.length, c };
}

function signal(q, n, c) {
  const p = (k) => pct(c[k] || 0, n);
  const mode = () => q.opts.reduce((a, o) => (c[o[0]] > c[a[0]] ? o : a), q.opts[0]);
  if (n < MIN_N) return { met: false, text: `Too early to judge: ${n} of ${MIN_N} answers.` };
  switch (q.id) {
    case "q1": { const v = ["t5", "t6", "t7", "t8"].reduce((a, k) => a + (c[k] || 0), 0); const pv = pct(v, n); return { met: pv < 25, text: `${pv}% at tones 5–8.` }; }
    case "q3": return { met: p("unsure") > 20, text: `${p("unsure")}% pick “I don't know”.` };
    case "q4": { const a = c.sunscreen || 0, b = c.moisturiser || 0; const met = Math.max(a, b) >= 3 * Math.max(1, Math.min(a, b)); return { met, text: `Sunscreen ${a}, moisturiser ${b}.` }; }
    case "q5": { const low = q.opts.filter((o) => o[0] !== "else" && p(o[0]) < 10).map((o) => o[1]); return { met: low.length > 0, text: low.length ? `Under 10%: ${low.join(", ")}.` : "Every shop is at 10% or more." }; }
    case "q6": return { met: p("reviews") < 15, text: `${p("reviews")}% picked online reviews.` };
    case "q7": case "q14": { const m = mode(); return { met: true, text: `Most common: ${m[1]} (${p(m[0])}%).` }; }
    case "q8": { const t = q.opts.slice().sort((a, b) => c[b[0]] - c[a[0]]).slice(0, 3).map((o) => o[1]); return { met: true, text: `Top 3: ${t.join(", ")}.` }; }
    case "q9": { const v = p("u10") + p("10-20"); return { met: v > 50, text: `${v}% spend under €20.` }; }
    case "q10": return { met: p("b") > 50, text: `${p("b")}% pick B, ${p("a")}% pick A.` };
    case "q11": { const v = p("yes") + p("reviews"); return { met: v < 50, text: `${v}% say Yes or “Only with reviews”.` }; }
    case "q12": return { met: p("no") > 50 || p("maybe") > 50, text: `No ${p("no")}%, maybe ${p("maybe")}%, yes ${p("yes")}%.` };
    case "q13": { const v = p("pushy") + p("stop"); return { met: v > 30, text: `${v}% say pushy or would stop.` }; }
  }
  return null;
}

const ICON_I = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.6" r="1" fill="currentColor"/></svg>`;
const ICON_F = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 14V2.5M3 3h8l-1.6 3L11 9H3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderAnalytics() {
  if (!data) return;
  const rows = filtered();
  const fc = $("#fcount"); if (fc) fc.textContent = `${rows.length} of ${(data.sorted || []).length} responses`;
  const html = QS.map((q) => {
    if (q.type === "text") {
      const list = rows.filter((r) => r[q.id] && String(r[q.id]).trim()).slice(0, 40);
      return `<article class="card wide"><h3>Q15 · ${esc(q.title)}</h3><span class="meta">${list.length} written answers${list.length === 40 ? " (latest 40)" : ""}</span>
        <div class="open">${list.length ? list.map((r) => `<p>${esc(r[q.id])}<span class="m">${esc(ago(r.receivedAt))}${r.q2 ? " · " + esc(lab("q2", r.q2)) : ""}${r.lang ? " · " + esc(r.lang.toUpperCase()) : ""}</span></p>`).join("") : `<p>No written answers yet.</p>`}</div>
        <div class="signal">${ICON_I}<span>${esc(SIGNALS.q15)}</span></div></article>`;
    }
    const { n, c } = counts(rows, q);
    const topVal = Math.max(...Object.values(c));
    const bars = q.opts.map((o) => {
      const v = c[o[0]], pc = pct(v, n);
      return `<div class="bar${v && v === topVal ? " lead" : ""}" tabindex="0" data-tip="${esc(`${v} of ${n} people · ${pc}%`)}" data-lab="${esc(o[1])}" aria-label="${esc(`${o[1]}: ${v} of ${n} people, ${pc}%`)}">
        <span class="l">${q.id === "q1" && TONES[o[0]] ? `<i class="sw" style="background:${TONES[o[0]]}"></i>` : ""}${esc(o[1])}</span><span class="track"><span class="fill" style="width:${n ? Math.max(v ? 1.5 : 0, v / n * 100) : 0}%"></span></span>
        <span class="val"><b>${pc}%</b> <span>${v}</span></span></div>`;
    }).join("");
    const sg = signal(q, n, c);
    const sig = SIGNALS[q.id] ? `<div class="signal${sg && sg.met && n >= MIN_N ? " met" : ""}">${sg && sg.met && n >= MIN_N ? ICON_F : ICON_I}<span>${sg ? `<b>${esc(sg.text)}</b> ` : ""}${esc(SIGNALS[q.id])}</span></div>` : "";
    return `<article class="card"><h3>${esc(q.id.toUpperCase())} · ${esc(q.title)}</h3>
      <span class="meta">${n} answered${q.type === "multi" ? (q.max ? ` · could pick up to ${q.max}` : " · could pick several") : ""}</span>
      <div class="bars">${bars}</div>${sig}</article>`;
  }).join("");
  const ch = $("#charts");
  ch.innerHTML = (data.sorted || []).length ? html : `<div class="empty wide">Charts appear here once the first answers arrive.</div>`;
}

/* ---------- Insights: what the answers mean for the product ---------- */
const TONE_DEEP = ["t5", "t6", "t7", "t8"], TONE_LIGHT = ["t1", "t2", "t3", "t4"];
function answeredRows(rows, qid) { return rows.filter((r) => Array.isArray(r[qid]) ? r[qid].length : r[qid] != null && r[qid] !== "" && r[qid] !== "na"); }
function share(rows, qid, vals) {
  const a = answeredRows(rows, qid);
  const k = a.filter((r) => (Array.isArray(r[qid]) ? r[qid] : [r[qid]]).some((v) => vals.includes(v))).length;
  return { k, n: a.length, p: pct(k, a.length) };
}
function modeOf(rows, qid) {
  const q = Q[qid], { n, c } = counts(rows, q);
  const best = q.opts.reduce((a, o) => (c[o[0]] > c[a[0]] ? o : a), q.opts[0]);
  return { id: best[0], label: best[1], p: pct(c[best[0]], n), n };
}
function confidence(n) {
  if (n < MIN_N) return { cls: "early", text: `Too early · ${n} answers` };
  if (n < 100) return { cls: "signal", text: `Early signal · ${n} answers` };
  return { cls: "solid", text: `Solid · ${n} answers` };
}
const V = {
  keep: { cls: "keep", label: "Keep the plan", icon: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
  change: { cls: "change", label: "Change the plan", icon: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h10M9 4.5L12.5 8 9 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
  watch: { cls: "watch", label: "Too early to call", icon: `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 5v3.5l2 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>` }
};

function decisions(rows) {
  const out = [];
  const add = (area, title, n, verdict, headline, evidence, action) => out.push({ area, title, n, verdict: n < MIN_N ? "watch" : verdict, headline, evidence, action });

  // 1. Home screen: chat or match list
  { const y = share(rows, "q11", ["yes"]), w = share(rows, "q11", ["reviews"]), no = share(rows, "q11", ["no"]), t = y.p + w.p;
    add("Product shape", "Chat as the home screen", y.n, t >= 50 ? "keep" : "change",
      `${t}% would trust an AI chat to pick a product, ${w.p}% of them only with real reviews.`,
      [`Yes: ${y.p}%`, `Only with reviews from real women: ${w.p}%`, `No: ${no.p}%`],
      t < 50 ? "Make the match list the home screen and keep the chat as a helper you open from it."
        : w.p >= y.p ? "Keep the chat, but every chat answer should show the peer reviews it is based on. That is what earns the trust."
        : "Keep the chat as the home screen. Reviews can stay one tap away."); }

  // 2. Review format
  { const a = share(rows, "q10", ["a"]), b = share(rows, "q10", ["b"]), both = share(rows, "q10", ["both"]);
    const lead = both.p >= Math.max(a.p, b.p) ? "both" : a.p >= b.p ? "a" : "b";
    add("Trust", "How reviews are shown", a.n, lead === "b" ? "change" : "keep",
      lead === "both" ? `Most want both: the “women like you” score and the familiar stars (${both.p}%).`
        : lead === "a" ? `The “11 of 14 women like you” score wins over stars (${a.p}% vs ${b.p}%).`
        : `Stars win over the “women like you” score (${b.p}% vs ${a.p}%).`,
      [`Option A, women like you: ${a.p}%`, `Option B, stars: ${b.p}%`, `Both together: ${both.p}%`],
      lead === "a" ? "Lead with the would-buy-again score. Stars are not needed on the main card."
        : lead === "both" ? "Show the would-buy-again score as the headline and the star average beside it."
        : "Show the star average first and add the “women like you” score as the second line, then test again."); }

  // 3. Minimum review count
  { const m = modeOf(rows, "q14");
    add("Trust", "Minimum number of reviews", m.n, "keep",
      m.id === "any" ? `The number of reviews doesn't matter to most (${m.p}%).` : `Most want at least ${m.id} reviews from women like them (${m.p}%).`,
      Q.q14.opts.map((o) => `${o[1]}: ${share(rows, "q14", [o[0]]).p}%`),
      m.id === "any" ? "Show “women like you” results from 3 reviews and say how many there are."
        : `Show “women like you” results from ${m.id} reviews. Below that, show all reviews and say why. You'll need about ${m.id} reviews per product per skin type before launch.`); }

  // 4. Give-to-get
  { const neg = share(rows, "q13", ["pushy", "stop"]), ex = share(rows, "q13", ["explain"]);
    add("Reviews", "Review one to unlock all", neg.n, neg.p > 30 ? "change" : "keep",
      `${neg.p}% find it pushy or would stop; ${ex.p}% are fine if you explain why.`,
      Q.q13.opts.map((o) => `${o[1]}: ${share(rows, "q13", [o[0]]).p}%`),
      neg.p > 30 ? "Don't lock reviews at the start. Ask for the first review after she has seen a few matches, or after a week."
        : ex.p >= 25 ? "Keep the unlock, and always say in one line why you ask: her review helps women with skin like hers."
        : "Keep the unlock as designed."); }

  // 5. Skin questions in onboarding
  { const u = share(rows, "q3", ["unsure"]);
    add("Matching", "Asking how her skin feels", u.n, u.p > 20 ? "change" : "keep",
      `${u.p}% don't know how their skin feels by midday.`,
      Q.q3.opts.map((o) => `${o[1]}: ${share(rows, "q3", [o[0]]).p}%`),
      u.p > 20 ? "Make the 1-minute skin test the default path, not the “not sure?” link." : "Keep the simple tap question; the skin test can stay optional."); }
  { const no = share(rows, "q12", ["no"]), mb = share(rows, "q12", ["maybe"]), y = share(rows, "q12", ["yes"]);
    add("Matching", "Asking about skin concerns", no.n, no.p > 50 ? "change" : "keep",
      `${y.p}% would share concerns, ${mb.p}% maybe, ${no.p}% would not.`,
      [`Yes: ${y.p}%`, `Maybe, if it's clear what happens: ${mb.p}%`, `No: ${no.p}%`],
      no.p > 50 ? "Drop the concerns question at launch. Match on skin feel, tone, age and budget only."
        : mb.p >= y.p ? "Keep it optional, and show a short plain line on what happens with it before she answers."
        : "Keep the optional concerns question with its separate consent."); }

  // 6. Catalogue
  { const s = share(rows, "q4", ["sunscreen"]), m = share(rows, "q4", ["moisturiser"]);
    const big = Math.max(s.k, m.k), small = Math.max(1, Math.min(s.k, m.k)), which = s.k >= m.k ? "sunscreen" : "moisturiser";
    add("Catalogue", "Which product to build first", s.n, big >= 3 * small ? "change" : "keep",
      big >= 3 * small ? `${which === "sunscreen" ? s.p : m.p}% answered about ${which}, three times as many as the other.` : `Sunscreen ${s.p}%, moisturiser ${m.p}%: neither dominates.`,
      [`Sunscreen: ${s.p}%`, `Moisturiser: ${m.p}%`, `Neither: ${share(rows, "q4", ["neither"]).p}%`],
      big >= 3 * small ? `Launch with ${which} only, and add the other later.` : "Launch with both; neither dominates."); }
  { const low = Q.q5.opts.filter((o) => o[0] !== "else" && share(rows, "q5", [o[0]]).p < 10).map((o) => o[1]);
    const n = answeredRows(rows, "q5").length;
    add("Catalogue", "Which shops to cover", n, low.length ? "change" : "keep",
      low.length ? `${low.join(", ")} ${low.length > 1 ? "are" : "is"} under 10%.` : "Every shop is used by 10% or more.",
      Q.q5.opts.map((o) => `${o[1]}: ${share(rows, "q5", [o[0]]).p}%`),
      low.length ? `Leave ${low.join(" and ")} out of the launch catalogue.` : "Keep all five shops in the catalogue."); }
  { const u = share(rows, "q9", ["u10", "10-20"]);
    add("Catalogue", "Price range", u.n, "keep",
      `${u.p}% usually spend under €20.`,
      Q.q9.opts.map((o) => `${o[1]}: ${share(rows, "q9", [o[0]]).p}%`),
      u.p > 50 ? "Fill the catalogue with drugstore products first and default the budget filter to under €20." : "Cover pharmacy and Douglas price ranges too; budget is not the main filter."); }
  { const { n, c } = counts(rows, Q.q8);
    const top = Q.q8.opts.slice().sort((a, b) => c[b[0]] - c[a[0]]).slice(0, 3);
    add("Matching", "Filters shown first", n, "keep",
      `Top 3: ${top.map((o) => o[1]).join(", ")}.`,
      top.map((o) => `${o[1]}: ${pct(c[o[0]], n)}%`),
      `Show ${top.map((o) => o[1].toLowerCase()).join(", ")} as the first filter chips on the match list.`); }

  // 7. Check-in timing
  { const m = modeOf(rows, "q7");
    add("Reviews", "When to ask for the check-in", m.n, "keep",
      `Most can tell after ${m.label.toLowerCase()} (${m.p}%).`,
      Q.q7.opts.map((o) => `${o[1]}: ${share(rows, "q7", [o[0]]).p}%`),
      `Send the first check-in after ${m.label.toLowerCase()}, with a second one later for slower products.`); }
  return out;
}

function sampleNotes(rows) {
  const notes = [];
  const n = rows.length;
  const tones = share(rows, "q1", TONE_DEEP);
  if (tones.n >= 10 && tones.p < 25) notes.push(`Only ${tones.p}% of answers are from deeper skin tones (5–8). White-cast results mostly reflect lighter skin, so share the survey in more diverse groups.`);
  const ages = Q.q2.opts.map((o) => [o[1], rows.filter((r) => r.q2 === o[0]).length]);
  const thin = ages.filter(([, k]) => k < 30).map(([l]) => l);
  if (n >= 30 && thin.length) notes.push(`Under 30 answers in: ${thin.join(", ")}. Treat age comparisons there as hints.`);
  const g = {}; rows.forEach((r) => { const k = r.group || "no group code"; g[k] = (g[k] || 0) + 1; });
  const big = Object.entries(g).sort((a, b) => b[1] - a[1])[0];
  if (n >= 20 && big && big[1] / n > .5) notes.push(`${pct(big[1], n)}% of answers come from “${big[0]}”. One group can tilt the results; compare it with the others using the Group filter.`);
  const nl = rows.filter((r) => r.lang === "nl").length;
  if (n >= 20 && pct(nl, n) < 30) notes.push(`Only ${pct(nl, n)}% answered in Dutch. Share the Dutch link (?lang=nl) to reach more women who don't use English daily.`);
  return notes;
}

function segments(rows) {
  const out = [];
  const cmp = (label, a, b, qid, vals, what) => {
    const x = share(a, qid, vals), y = share(b, qid, vals);
    if (x.n >= 10 && y.n >= 10 && Math.abs(x.p - y.p) >= 15) out.push({ text: `${what}: ${label[0]} ${x.p}% vs ${label[1]} ${y.p}%.`, gap: Math.abs(x.p - y.p) });
  };
  const by = (qid, vals) => rows.filter((r) => vals.includes(r[qid]));
  const deep = by("q1", TONE_DEEP), light = by("q1", TONE_LIGHT);
  cmp(["deeper tones", "lighter tones"], deep, light, "q8", ["nocast"], "“No white cast” matters to");
  const young = by("q2", ["18-24", "25-34"]), older = by("q2", ["35-44", "45-54", "55+"]);
  cmp(["under 35", "35 and older"], young, older, "q11", ["yes", "reviews"], "Would trust an AI chat");
  cmp(["under 35", "35 and older"], young, older, "q9", ["u10", "10-20"], "Spend under €20");
  cmp(["under 35", "35 and older"], young, older, "q6", ["social"], "Picked it through social media");
  cmp(["under 35", "35 and older"], young, older, "q13", ["pushy", "stop"], "Find review-to-unlock pushy");
  const nl = by("lang", ["nl"]), en = by("lang", ["en"]);
  cmp(["Dutch", "English"], nl, en, "q11", ["yes", "reviews"], "Would trust an AI chat, answering in");
  const sun = by("q4", ["sunscreen"]), moi = by("q4", ["moisturiser"]);
  cmp(["sunscreen", "moisturiser"], sun, moi, "q6", ["friend"], "Picked on a friend's tip, for");
  return out.sort((a, b) => b.gap - a.gap).slice(0, 6);
}

const THEMES = [
  ["Sunscreen and SPF", /spf|sunscreen|zonnebrand|zon\b|sun\b|uv/i],
  ["Spots and breakouts", /acne|puist|pimple|spot|breakout|mee-?eter/i],
  ["Dry or tight skin", /dry|droog|tight|strak|flak|schilfer/i],
  ["Oily or shiny skin", /oil|vet|shin|glim|glans/i],
  ["Sensitive skin, stinging", /sensit|gevoelig|sting|prik|brand|red|rood|irrit/i],
  ["Ingredients", /ingredi|retinol|niacin|acid|zuur|parfum|fragrance|alcohol/i],
  ["Price and value", /price|prijs|cheap|goedkoop|budget|duur|expens/i],
  ["Make-up", /make-?up|foundation|pill/i],
  ["Ageing, lines, spots", /wrinkle|rimpel|aging|anti-?age|pigment|dark spot|vlek/i]
];
function themes(rows) {
  const texts = rows.map((r) => r.q15).filter((t) => t && String(t).trim());
  return { n: texts.length, list: THEMES.map(([name, re]) => [name, texts.filter((t) => re.test(t)).length]).filter(([, k]) => k > 0).sort((a, b) => b[1] - a[1]) };
}

function renderInsights() {
  const rows = data.sorted || [];
  const box = $("#insights"); if (!box) return;
  const conf = confidence(rows.length);
  if (!rows.length) { box.innerHTML = `<div class="empty">The analysis appears here once answers come in.</div>`; return; }
  const ds = decisions(rows);
  const ready = ds.filter((d) => d.verdict !== "watch");
  const top = [...ready.filter((d) => d.verdict === "change"), ...ready.filter((d) => d.verdict === "keep")].slice(0, 3);
  const notes = sampleNotes(rows), segs = segments(rows), th = themes(rows);
  const areas = [...new Set(ds.map((d) => d.area))];
  box.innerHTML = `
    <div class="ins-head"><span class="conf ${conf.cls}">${esc(conf.text)}</span><span class="sub">Based on all answers; the filters above don't apply here.</span></div>
    <div class="summary">
      <h3>What the survey says so far</h3>
      ${top.length ? `<ol>${top.map((d) => `<li><b>${esc(d.title)}:</b> ${esc(d.headline)} <span class="act">${esc(d.action)}</span></li>`).join("")}</ol>`
        : `<p>Each decision needs at least ${MIN_N} answers before it's called. ${Math.max(0, MIN_N - rows.length)} more to go.</p>`}
    </div>
    ${notes.length ? `<div class="notes"><h3>Before you trust these numbers</h3><ul>${notes.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    ${areas.map((a) => `<h3 class="area">${esc(a)}</h3><div class="dgrid">${ds.filter((d) => d.area === a).map((d) => `
      <article class="dcard ${V[d.verdict].cls}">
        <div class="dtop"><span class="pill ${V[d.verdict].cls}">${V[d.verdict].icon}${esc(V[d.verdict].label)}</span><span class="dn">${d.n} answers</span></div>
        <h4>${esc(d.title)}</h4>
        <p class="hl">${esc(d.headline)}</p>
        <ul class="ev">${d.evidence.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>
        <p class="next"><b>Next step:</b> ${esc(d.action)}</p>
      </article>`).join("")}</div>`).join("")}
    <h3 class="area">Differences between groups</h3>
    ${segs.length ? `<ul class="segs">${segs.map((s) => `<li>${esc(s.text)}</li>`).join("")}</ul><p class="sub">Shown when both groups have 10 or more answers and differ by 15 points or more.</p>`
      : `<p class="sub">No clear differences yet. They show up when two groups each have 10 or more answers and differ by 15 points or more.</p>`}
    <h3 class="area">What women would ask a skincare chat</h3>
    ${th.list.length ? `<div class="themes">${th.list.map(([name, k]) => `<span class="theme"><b>${k}</b> ${esc(name)}</span>`).join("")}</div><p class="sub">From ${th.n} written answers to Q15, sorted by keyword. Use the biggest themes as the chat's starter chips and in the knowledge base.</p>`
      : `<p class="sub">No written answers to sort yet.</p>`}`;
}

const tip = $("#tip");
function showTip(el, x, y) {
  tip.innerHTML = `<b>${esc(el.dataset.tip)}</b><br>${esc(el.dataset.lab)}`;
  tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, x + 14) + "px"; tip.style.top = Math.max(8, y - h - 10) + "px";
}
document.addEventListener("pointermove", (e) => { const b = e.target.closest && e.target.closest(".bar"); if (b) showTip(b, e.clientX, e.clientY); else tip.classList.remove("on"); });
document.addEventListener("focusin", (e) => { const b = e.target.closest && e.target.closest(".bar"); if (b) { const r = b.getBoundingClientRect(); showTip(b, r.left + r.width / 2, r.top); } else tip.classList.remove("on"); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && key) load(); });

try { key = localStorage.getItem(KEYSTORE) || ""; } catch (e) {}
if (key) load(); else gate();
</script>
