/* Layout: one narrow column, one question per screen; sticky progress on top, action bar at the bottom. */
:root {
  /* One light theme: white ground, pastel green and blue for the design. */
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #1f2d35;
  --muted: #5b6b73;
  --line: #d8e3e8;
  --accent: #2c7a6a;        /* buttons and selected states (readable with white text) */
  --accent-ink: #ffffff;
  --accent-soft: #e1f3ea;   /* pastel green */
  --green-mid: #9fd6bd;
  --blue: #7fb2e5;
  --blue-soft: #e1eefb;     /* pastel blue */
  --sun: #f3d27a;           /* soft butter yellow, only for the sun and stars */
  --sun-soft: #e1eefb;
  --blush: #f6ddd8;
  --cream: #f6faf8;
  --tone: #a86f4c;
  --warn: #9a5a12;
  --shadow: none;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
  color-scheme: light;
}

html { box-sizing: border-box; height: 100%; }
body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }

.app { max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }

/* Top bar */
.bar {
  position: relative; z-index: 5; background: var(--bg); flex: none;
  display: flex; flex-direction: column; gap: 10px; padding-block: 16px 10px;
}
.barrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.about {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 4px 14px 4px 4px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px;
  animation: inF .3s ease-out;
}
.about svg { width: 30px; height: 30px; }
.about b { font-weight: 700; }
.about .chg { color: var(--accent); font-weight: 700; }
.about:hover { border-color: var(--accent); }
.bar[hidden] { display: none !important; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { background: var(--accent-soft); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.prog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

.stage { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; padding-block: 8px 24px; margin-inline: -4px; padding-inline: 4px; }
.stage > .screen { flex: none; }
.stage > .welcome { flex: 1 0 auto; }
.stage:has(.welcome) { padding-block: 16px; }
.screen { display: flex; flex-direction: column; gap: 20px; }
.in-fwd { animation: inF .38s cubic-bezier(.2, .8, .2, 1); }
.in-back { animation: inB .38s cubic-bezier(.2, .8, .2, 1); }
@keyframes inF { from { transform: translateX(28px); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes inB { from { transform: translateX(-28px); opacity: .2; } to { transform: none; opacity: 1; } }

/* Question header */
.q-head { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lead { font-size: 17px; color: var(--ink); background: var(--blue-soft); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
h1, h2 { font-family: var(--f-display); font-weight: 650; letter-spacing: -.015em; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(24px, 6.4vw, 30px); line-height: 1.15; }
h2:focus { outline: none; }
h2 .scn { font-weight: 500; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); align-items: center; gap: 8px; }
.step { background: var(--accent-soft); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
.step .ill { width: 44px; height: 44px; }
.step .ill svg { width: 100%; height: 100%; display: block; }
.step .tx { display: flex; flex-direction: column; gap: 2px; }
.step .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.step .d { font-size: 14px; color: var(--muted); }

.hint { color: var(--muted); font-size: 15px; margin: 0; }

/* Options */
.opts { display: grid; gap: 10px; }
.opts.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt {
  position: relative; width: 100%; min-width: 0; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  min-height: 58px; padding: 12px 52px 12px 16px;

.opt .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt .t { font-weight: 700; }
.opt .d { color: var(--muted); font-size: 14px; }
.opt.card { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 14px 16px; min-height: 140px; }
.opt.card .ill { width: 64px; height: 64px; }
.opt.wide { grid-column: 1 / -1; min-height: 58px; flex-direction: row; align-items: center; padding: 12px 52px 12px 16px; }
.opt.wide .ill { width: 40px; height: 40px; }
.opt .ill.sm { width: 48px; height: 48px; flex: none; }
.opt .ill svg { width: 100%; height: 100%; display: block; overflow: visible; }
.opt.on .ill svg { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.1) rotate(-3deg); } 100% { transform: scale(1); } }

.mark {
  position: absolute; right: 16px; top: 50%; translate: 0 -50%;
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; transition: background-color .2s, border-color .2s;
}
.card .mark { top: 14px; right: 14px; translate: none; }
.multi .mark { border-radius: 7px; }
.mark svg { width: 14px; height: 14px; stroke: var(--accent-ink); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transform: scale(0); transition: transform .22s cubic-bezier(.3, 1.6, .5, 1); }
.on .mark { background: var(--accent); border-color: var(--accent); }
.on .mark svg { transform: scale(1); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  min-height: 52px; padding: 0 20px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  transition: border-color .2s, background-color .2s, color .2s, transform .12s;
}
.chip:hover { border-color: var(--accent); }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.dim { opacity: .45; }

/* Duration bars (Q7) */
.dur { margin-left: auto; flex: none; width: 88px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.dur i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }

/* Compare cards (Q9) */
.brands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.brand {
  position: relative; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 10px 8px 8px; min-width: 0;
  border: 1.5px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; cursor: pointer;
  transition: border-color .2s, background-color .2s, transform .12s;
}
.brand:hover { border-color: var(--accent); }
.brand:active { transform: scale(.98); }
.brand.on { border-color: var(--accent); background: var(--accent-soft); }
.brand .tx { display: flex; flex-direction: column; min-width: 0; }
.brand .t { font-weight: 700; font-size: 14.5px; line-height: 1.2; overflow-wrap: break-word; hyphens: manual; }
.brand .d { font-size: 12px; color: var(--muted); line-height: 1.25; }
.mono { flex: none; width: 40px; height: 40px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--ink); }
.mono svg { display: block; }
.mono .xs, .mono .tick { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; }
.brand.on .mono .tick { background: var(--accent); }
.brand.on .mono .tick svg { width: 16px; height: 16px; stroke: var(--accent-ink); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.extra .mono .xs { border: 1.5px dashed var(--line); }

.otherin { width: 100%; min-height: 50px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; margin-top: -10px; }
.otherin:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tone { display: flex; flex-direction: column; gap: 14px; padding-top: 6px; }
.tprev { display: flex; align-items: center; gap: 14px; }
.tsw { width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--line); flex: none; transition: background-color .15s; }
.tsw.set { border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); }
.tval { font-family: var(--f-display); font-size: 20px; font-weight: 650; }
.trange { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; cursor: pointer; }
.trange::-webkit-slider-runnable-track { height: 22px; border-radius: 99px; background: var(--track); }
.trange::-moz-range-track { height: 22px; border-radius: 99px; background: var(--track); }
.trange::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; margin-top: -7px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.18); opacity: .55; }
.trange::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); opacity: .55; }
.trange.set::-webkit-slider-thumb { opacity: 1; }
.trange.set::-moz-range-thumb { opacity: 1; }
.trange:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 99px; }
.tends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: -8px; }
.vs { display: grid; gap: 12px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt.pcard { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 12px 14px; }
.pcard .mark { top: 12px; right: 12px; translate: none; }
.plab { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; background: var(--blue-soft); }
.on .plab { background: var(--surface); }
.pthumb { height: 76px; border-radius: 12px; background: var(--blue-soft); display: grid; place-items: center; }
.pthumb svg { width: 58px; height: 58px; overflow: visible; }
.pname { display: flex; flex-direction: column; font-size: 13px; line-height: 1.3; }
.pname b { font-size: 14px; }
.pname span { color: var(--muted); }
.pdiv { height: 1px; background: var(--line); }
.pcard .big { font-family: var(--f-display); font-size: 24px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.people { display: grid; grid-template-columns: repeat(7, minmax(0, 14px)); gap: 3px 4px; }
.people svg { width: 100%; height: auto; display: block; }
.people .pf { fill: var(--accent); }
.people .pe { fill: var(--line); }
.pcard .cap { font-size: 13px; line-height: 1.35; color: var(--ink); }
.mock { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.mock .lab { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dots i.f { background: var(--accent); }
.stars { display: flex; gap: 3px; }
.stars svg { width: 20px; height: 20px; }
.mock .big { font-family: var(--f-display); font-size: 19px; font-weight: 650; line-height: 1.25; }

textarea {
  width: 100%; min-height: 140px; resize: vertical; padding: 14px 16px; border-radius: var(--r);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; line-height: 1.45;
}
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.counter { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Action bar */
.btnrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nudge:empty { display: none; }
.actions {
  position: relative; z-index: 4; flex: none;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  padding-block: 18px calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
  box-shadow: 0 -18px 18px -6px var(--bg);
}
.actions[hidden] { display: none !important; }
.nudge { font-size: 14px; color: var(--muted); min-height: 20px; }
.nudge.warn { color: var(--warn); font-weight: 700; }
.btn {
  min-height: 52px; padding: 0 28px; border-radius: 99px; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 650; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
  transition: transform .12s, filter .2s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.97); }
.btn.quiet { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* Welcome */
.welcome { flex: 1; min-height: 0; gap: 14px; }
.hero { flex: 1 1 0; min-height: 110px; max-height: 300px; width: 100%; max-width: 100%; background: var(--blue-soft); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
.welcome .start { margin-top: 4px; }
.hero { position: relative; }
.langs { position: absolute; top: 12px; right: 12px; display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--line); }
.langs button { min-width: 44px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 99px; background: transparent; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; }
.langs button.on { background: var(--accent); color: var(--accent-ink); }
.hero svg { width: 100%; height: 100%; display: block; }
.hero .sunG { animation: rise 1.1s cubic-bezier(.2, .8, .2, 1) both; transform-box: fill-box; transform-origin: center; }
.hero .p1 { animation: drop .7s .15s cubic-bezier(.3, 1.4, .5, 1) both; }

@keyframes rise { from { transform: translateY(26px); } to { transform: none; } }
@keyframes drop { from { transform: translateY(-14px); } to { transform: none; } }
h1 { font-size: clamp(27px, 7.6vw, 40px); line-height: 1.06; }
.intro { margin: 0; font-size: 16px; color: var(--ink); max-width: 34em; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: var(--blue-soft); color: var(--ink); }

.promise li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.promise svg { width: 20px; height: 20px; margin-top: 1px; stroke: var(--accent); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.start { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.small { font-size: 14px; color: var(--muted); margin: 0; }
.small b { color: var(--ink); font-weight: 700; user-select: all; }

/* Done */
.done { align-items: center; text-align: center; padding-top: 40px; gap: 18px; }
.done .check { width: 96px; height: 96px; }
.done .check circle { fill: var(--accent-soft); }
.done .check path { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 0; animation: draw .6s .15s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
.done p { margin: 0; max-width: 30em; }
.status { font-size: 14px; color: var(--muted); }
.status.warn { color: var(--warn); font-weight: 700; }
.done { padding-top: 12px; }
.play {
  position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 0 auto; cursor: pointer;
  background: var(--blue-soft); border-radius: 32px; box-shadow: var(--shadow); overflow: hidden; touch-action: manipulation; user-select: none;
}
.play svg, .play canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.play .sunSpin { transform-box: view-box; transform-origin: 232px 70px; animation: spin 24s linear infinite; }
.play .face { transform-box: view-box; transform-origin: 150px 230px; animation: bob 3.2s ease-in-out infinite; }
.play .face.go { animation: yay .45s cubic-bezier(.3, 1.6, .5, 1), bob 3.2s .45s ease-in-out infinite; }
.play .tubeG { transform-box: fill-box; transform-origin: 50% 100%; }
.play .tubeG.go { animation: squeeze .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes yay { 0% { transform: scale(1); } 40% { transform: scale(1.06) rotate(-2deg); } 100% { transform: scale(1); } }
@keyframes squeeze { 0% { transform: scale(1, 1); } 35% { transform: scale(1.12, .82); } 100% { transform: scale(1, 1); } }
.playhint { font-size: 15px; color: var(--muted); font-weight: 700; min-height: 22px; font-variant-numeric: tabular-nums; }

/* ---------- State ---------- */
const KEY = "skincare-survey-v1";
let state = { screen: "welcome", i: 0, ans: {}, startedAt: 0, status: "" };
let advanceTimer = null;
const $ = (id) => document.getElementById(id);
const stage = $("stage");

function saveDraft() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function loadDraft() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.screen) return s; } catch (e) {}
  return null;
}
const product = () => { const p = UI[lang()].product; return state.ans.q4 === "sunscreen" ? p.sunscreen : state.ans.q4 === "moisturiser" ? p.moisturiser : p.either; };
const fill = (t) => t.replace("{p}", product());
const visible = (q) => !(state.ans.q4 === "neither" && (q.id === "q5" || q.id === "q6" || q.id === "q7"));
const visList = () => QS.filter(visible);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Rendering ---------- */
function render(dir = 1) {
  clearTimeout(advanceTimer);
  const s = state.screen;
  $("bar").hidden = s !== "q";
  $("actions").hidden = s !== "q";
  let html = "";
  if (s === "welcome") html = welcomeHTML();
  else if (s === "q") html = questionHTML(QS[state.i]);
  else html = doneHTML();
  stage.innerHTML = html;
  const scr = stage.firstElementChild;
  if (dir) scr.classList.add(dir < 0 ? "in-back" : "in-fwd");
  if (s === "q") { updateChrome(); const h = stage.querySelector("h2"); if (h) h.focus({ preventScroll: true }); }
  if (s === "done") initPlay();
  stage.scrollTop = 0;
  saveDraft();
}

      }).join("") + `</div>`;
  }

    <div class="q-head">

      ${qt(q, "hint") ? `<p class="hint">${esc(fill(qt(q, "hint")))}</p>` : ""}
    </div>
    ${q.scenario === "unlock" ? `<div class="flow" aria-label="${esc(t("flowAria"))}">
      <div class="step"><span class="ill">${svg("taps")}</span><span class="tx"><span class="k">${esc(t("step", { n: 1 }))}</span><b>${esc(t("s1b"))}</b><span class="d">${esc(t("s1d"))}</span></span></div>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <div class="step"><span class="ill">${svg("reviews")}</span><span class="tx"><span class="k">${esc(t("step", { n: 2 }))}</span><b>${esc(t("s2b"))}</b><span class="d">${esc(t("s2d"))}</span></span></div>
    </div>` : ""}
    ${body}
  </section>`;
}

function answered(q) {
  const v = state.ans[q.id];
  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  if (q.type === "text") return !!(v && v.trim());
  return !!v;  // tone: "t1".."t10" or "na"
}

function updateChrome() {
  const q = QS[state.i], list = visList(), pos = list.indexOf(q) + 1;
  const pct = Math.round(((pos - 1) + (answered(q) ? 1 : 0)) / list.length * 100);
  $("progFill").style.width = Math.max(pct, 3) + "%";
  $("prog").setAttribute("aria-valuenow", String(pct));
  $("count").textContent = `${pos}/${list.length}`;
  const about = $("about");
  const chosen = state.ans.q4 === "sunscreen" || state.ans.q4 === "moisturiser";
  about.hidden = !(chosen && QS.indexOf(q) > QS.findIndex((x) => x.id === "q4"));
  if (!about.hidden) about.innerHTML = `${svg(state.ans.q4 === "sunscreen" ? "tube" : "jar")}<span>${esc(t("aboutA"))} <b>${esc(product())}</b></span><span class="chg">${esc(t("change"))}</span>`;
  $("back").innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>${esc(t("back"))}`;
  const last = pos === list.length;
  const nextBtn = $("next");
  nextBtn.innerHTML = last ? `${esc(t("finish"))} <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`
    : answered(q) ? `${esc(t("next"))} <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>` : esc(t("skip"));
  nextBtn.classList.toggle("quiet", !last && !answered(q));
  const n = $("nudge");
  n.classList.remove("warn");
  if (q.type === "multi" && q.max) {
    const c = (state.ans[q.id] || []).length;
    n.textContent = c ? t("picked", { c, m: q.max }) : "";
  } else n.textContent = "";
  if (q.type === "multi" && q.max) {
    const full = (state.ans[q.id] || []).length >= q.max;
    stage.querySelectorAll("[data-opt]").forEach((b) => b.classList.toggle("dim", full && !b.classList.contains("on")));
  }
}

function validContact(v) {
  if (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return true;
  const digits = v.replace(/\D/g, "");
  return /^[+\d\s().-]+$/.test(v) && digits.length >= 9 && digits.length <= 15;
}

async function sendContact() {
  const input = $("contact"), err = $("ferr"), btn = $("contactBtn");
  const v = (input.value || "").trim();
  const wants = [...stage.querySelectorAll("[data-want].on")].map((b) => b.dataset.want);
  if (!wants.length) { err.textContent = t("errWants"); return; }
  if (!validContact(v)) { err.textContent = t("errContact"); input.focus(); return; }
  err.textContent = ""; btn.disabled = true; btn.textContent = t("sending");
  const body = { contact: v, wants, v: CONFIG.version };
  try {
    const caps = await capsReady;
    if (caps.mode === "claude") await caps.db.doc("contacts/" + caps.uid).set({ ...body, receivedOn: new Date().toISOString().slice(0, 10) });
    else if (caps.mode === "web") {
      const r = await fetch("/api/contact", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, website: $("website").value }) });
      if (!r.ok) throw new Error("status " + r.status);
    }
    state.contactSent = true; saveDraft();
    $("signupBox").innerHTML = signupHTML();
  } catch (e) {
    err.textContent = t("errSend");
    btn.disabled = false; btn.textContent = t("send");
  }
}

/* ---------- Thank-you play: tap to squeeze out sunshine ---------- */
let drops = 0, playedOnce = false, parts = [], raf = 0;
function initPlay() {
  const play = $("play"), cv = $("fx");
  if (!play || !cv) return;
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const size = () => { const r = play.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  size();
  try { new ResizeObserver(size).observe(play); } catch (e) {}
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hint = $("playhint");
  const words = UI[lang()].words;

  function burst(x, y, n) {
    const cols = [css("--blue"), css("--green-mid"), css("--accent"), css("--sun"), css("--blue")];
    for (let k = 0; k < n; k++) {
      parts.push({ x, y, vx: reduce ? 0 : (Math.random() - .5) * 7, vy: reduce ? 0 : -Math.random() * 7 - 2,
        r: 4 + Math.random() * 6, kind: ["dot", "spark", "heart", "drop"][k % 4], c: cols[k % cols.length],
        rot: Math.random() * 6, vr: (Math.random() - .5) * .2, life: 1, ox: reduce ? (Math.random() - .5) * 120 : 0, oy: reduce ? (Math.random() - .5) * 80 : 0 });
    }
    drops += n;
    if (hint) hint.textContent = `${t("drops", { n: drops })} ${words[Math.min(words.length - 1, Math.floor(drops / 40))]}`;
    const tube = play.querySelector(".tubeG"), face = play.querySelector(".face");
    [tube, face].forEach((el) => { if (!el) return; el.classList.remove("go"); void el.getBoundingClientRect(); el.classList.add("go"); });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function shape(p) {
    ctx.save(); ctx.translate(p.x + p.ox, p.y + p.oy); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c;
    const r = p.r; ctx.beginPath();
    if (p.kind === "dot") ctx.arc(0, 0, r, 0, Math.PI * 2);
    else if (p.kind === "spark") { ctx.moveTo(0, -r * 1.4); ctx.quadraticCurveTo(0, 0, r * 1.4, 0); ctx.quadraticCurveTo(0, 0, 0, r * 1.4); ctx.quadraticCurveTo(0, 0, -r * 1.4, 0); ctx.quadraticCurveTo(0, 0, 0, -r * 1.4); }
    else if (p.kind === "heart") { ctx.moveTo(0, r * .9); ctx.bezierCurveTo(-r * 1.6, -r * .2, -r * .6, -r * 1.4, 0, -r * .4); ctx.bezierCurveTo(r * .6, -r * 1.4, r * 1.6, -r * .2, 0, r * .9); }
    else { ctx.moveTo(0, -r * 1.3); ctx.bezierCurveTo(r, -r * .2, r, r, 0, r); ctx.bezierCurveTo(-r, r, -r, -r * .2, 0, -r * 1.3); }
    ctx.fill(); ctx.restore();
  }
  function tick() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);
    parts = parts.filter((p) => p.life > 0);
    for (const p of parts) {
      if (!reduce) {
        p.vy += .22; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y > h - p.r - 6) { p.y = h - p.r - 6; p.vy *= -.5; p.vx *= .8; }
        if (p.x < p.r || p.x > w - p.r) p.vx *= -1;
      }
      p.life -= reduce ? .02 : .007;
      shape(p);
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!raf) ctx.clearRect(0, 0, w, h);
  }
  const at = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  play.addEventListener("pointerdown", (e) => { const [x, y] = at(e); burst(x, y, 14); });
  play.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); burst(cv.clientWidth / 2, cv.clientHeight / 2, 18); } });
  if (!playedOnce) { playedOnce = true; setTimeout(() => { if ($("fx") === cv) { const w = cv.clientWidth; burst(w * .3, cv.clientHeight * .6, 12); burst(w * .7, cv.clientHeight * .55, 12); drops = 0; if (hint) hint.textContent = t("playHint"); } }, 350); }
}

/* ---------- Navigation ---------- */
function go(delta) {
  const list = visList();
  const pos = list.indexOf(QS[state.i]);
  const target = list[pos + delta];
  if (delta < 0 && !target) { state.screen = "welcome"; render(-1); return; }
  if (!target) { finish(); return; }
  state.i = QS.indexOf(target);
  render(delta);
}

function choose(q, id, el) {
  if (q.type === "tone") {
    state.ans[q.id] = state.ans[q.id] === id ? "" : id;
    render(0); saveDraft();
    if (state.ans[q.id]) advanceTimer = setTimeout(() => go(1), 420);
    return;
  }
  if (q.layout === "brands") {
    state.ans[q.id] = id;
    if (id !== "other") delete state.ans.q5o;
    render(0); saveDraft();
    if (id === "other") { const i = $("q5o"); if (i) i.focus(); }
    else advanceTimer = setTimeout(() => go(1), 420);
    return;
  }
  if (q.type === "single") {
    state.ans[q.id] = id;
    stage.querySelectorAll("[data-opt]").forEach((b) => { const on = b.dataset.opt === id; b.classList.toggle("on", on); b.setAttribute("aria-checked", on); });
    updateChrome(); saveDraft();
    clearTimeout(advanceTimer);
    const list = visList();
    if (list.indexOf(q) < list.length - 1) advanceTimer = setTimeout(() => go(1), 420);
    return;
  }
  let v = Array.isArray(state.ans[q.id]) ? state.ans[q.id].slice() : [];
  const opt = q.opts.find((o) => o[0] === id);
  const exclusive = opt && opt[6];
  if (v.includes(id)) v = v.filter((x) => x !== id);
  else {
    if (exclusive) v = [id];
    else {
      v = v.filter((x) => !(q.opts.find((o) => o[0] === x) || [])[6]);
      if (q.max && v.length >= q.max) {
        const n = $("nudge"); n.textContent = t("maxw", { m: q.max }); n.classList.add("warn");
        el.animate?.([{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(0)" }], { duration: 260 });
        return;
      }
      v.push(id);
    }
  }
  state.ans[q.id] = v;
  stage.querySelectorAll("[data-opt]").forEach((b) => { const on = v.includes(b.dataset.opt); b.classList.toggle("on", on); b.setAttribute("aria-checked", on); });
  updateChrome(); saveDraft();
}

/* ---------- Saving ---------- */
const capsReady = (async () => {
  const c = window.claude;
  if (!c || typeof c.use !== "function") return { mode: "web" };
  try {
    const db = await c.use("db");
    const user = db ? await c.use("user") : null;
    const uid = user && user.id ? await user.id() : null;
    return db && uid ? { mode: "claude", db, uid } : { mode: "preview" };
  } catch (e) { return { mode: "preview" }; }
})();

function groupCode() {
  let g = "";
  try { g = new URLSearchParams(location.search).get("g") || location.hash.slice(1); } catch (e) {}
  g = (g || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 32);
  return g === "reset" ? "" : g;
}

function payload() {
  const out = { v: CONFIG.version, lang: lang(), group: groupCode(), product: state.ans.q4 || "",
    durationSec: state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : null };
  QS.forEach((q) => { if (!visible(q)) return; const v = state.ans[q.id]; if (v != null && v !== "" && !(Array.isArray(v) && !v.length)) out[q.id] = v; });
  if (out.q5 === "other" && state.ans.q5o && state.ans.q5o.trim()) out.q5o = state.ans.q5o.trim();
  return out;
}

function setStatus(st) {
  state.status = st; saveDraft();
  const box = $("statusBox");
  if (box) box.innerHTML = statusHTML(); else render(1);
}

async function send() {
  if ($("statusBox")) setStatus("saving"); else { state.status = "saving"; render(1); }
  const data = payload();
  try {
    const caps = await capsReady;
    if (caps.mode === "claude") {
      await caps.db.doc("responses/" + caps.uid).set({ ...data, submittedAt: new Date().toISOString() });
      state.status = "saved";
    } else if (caps.mode === "preview") {
      state.status = "preview";
    } else {
      const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...data, website: $("website").value }) });
      if (!r.ok) throw new Error("status " + r.status);
      state.status = "saved";
    }
  } catch (e) {
    state.status = "error";
  }
  setStatus(state.status);
}

function finish() { state.screen = "done"; send(); }

/* ---------- Events ---------- */
stage.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) {
    if (act.dataset.act === "start") {
      state.screen = "q"; state.i = 0; if (!state.startedAt) state.startedAt = Date.now(); render(1);
    } else if (act.dataset.act === "retry") send();
    else if (act.dataset.act === "restart") resetSurvey();
    else if (act.dataset.act === "showswap") { swapOpen = true; $("swapBox").innerHTML = swapHTML(); const b = $("copyswap"); if (b) b.focus(); }
    else if (act.dataset.act === "copyswap") copySwap(act);
    return;
  }
  const lg = e.target.closest("[data-lang]");
  if (lg) { setLang(lg.dataset.lang); render(0); const f = stage.querySelector(`[data-lang="${lg.dataset.lang}"]`); if (f) f.focus({ preventScroll: true }); return; }
  const w = e.target.closest("[data-want]");
  if (w) { const on = !w.classList.contains("on"); w.classList.toggle("on", on); w.setAttribute("aria-pressed", on); const er = $("ferr"); if (er) er.textContent = ""; return; }
  const b = e.target.closest("[data-opt]");
  if (b && state.screen === "q") choose(QS[state.i], b.dataset.opt, b);
});
stage.addEventListener("change", (e) => {
  if (e.target.id === "toneR" && !state.ans[QS[state.i].id]) e.target.dispatchEvent(new Event("input", { bubbles: true }));
});
stage.addEventListener("pointerup", (e) => {
  if (e.target.id === "toneR" && !/^t/.test(state.ans[QS[state.i].id] || "")) e.target.dispatchEvent(new Event("input", { bubbles: true }));
});
stage.addEventListener("submit", (e) => {
  if (e.target.id === "signup") { e.preventDefault(); sendContact(); }
});
stage.addEventListener("input", (e) => {
  if (e.target.id === "q5o") { state.ans.q5o = e.target.value.slice(0, 40); saveDraft(); return; }
  if (e.target.id === "toneR") {
    const n = Number(e.target.value), q = QS[state.i];
    state.ans[q.id] = "t" + n;
    e.target.classList.add("set");
    const sw = $("tsw"); sw.style.background = TONES[n - 1]; sw.classList.add("set");
    $("tval").textContent = t("toneN", { n });
    e.target.setAttribute("aria-valuetext", t("toneN", { n }));
    stage.querySelectorAll('[data-opt="na"]').forEach((b) => { b.classList.remove("on"); b.setAttribute("aria-checked", "false"); });
    updateChrome(); saveDraft();
    return;
  }
  if (e.target.tagName === "TEXTAREA") {
    const q = QS[state.i]; state.ans[q.id] = e.target.value;
    const c = $("counter"); if (c) c.textContent = `${e.target.value.length} / 1000`;
    updateChrome(); saveDraft();
  }
});
$("next").addEventListener("click", () => go(1));
$("back").addEventListener("click", () => go(-1));
$("about").addEventListener("click", () => { state.i = QS.findIndex((q) => q.id === "q4"); render(-1); });
document.addEventListener("keydown", (e) => {
  if (state.screen !== "q" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "TEXTAREA" || (e.target.tagName === "INPUT" && e.target.type === "text" && /^[1-9]$/.test(e.key))) return;
  if (/^[1-9]$/.test(e.key)) {
    const b = stage.querySelector(`[data-n="${e.key}"]`);
    if (b) { e.preventDefault(); choose(QS[state.i], b.dataset.opt, b); }
  } else if (e.key === "Enter" && !e.target.closest("button")) { e.preventDefault(); go(1); }
});

/* ---------- Start ---------- */
function setLang(l) {
  state.lang = l === "nl" ? "nl" : "en";
  document.documentElement.lang = state.lang;
}

function resetSurvey() {
  state = { screen: "welcome", i: 0, ans: {}, startedAt: 0, status: "", contactSent: false, lang: state.lang };
  playedOnce = false; drops = 0; parts = [];
  try { localStorage.removeItem(KEY); } catch (e) {}
  render(-1);
}

function start(data) {
  let wantsReset = false;
  try { wantsReset = location.hash === "#reset"; } catch (e) {}
  if (wantsReset) { try { localStorage.removeItem(KEY); } catch (e) {} }
  const s = wantsReset ? null : ((data && data.state) || loadDraft());
  if (s) {
    state = { ...state, ...s };
    if (state.screen === "done" && state.status !== "saved" && state.status !== "preview") state.status = "error";
  }
  let want = "";
  try { want = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(); } catch (e) {}
  if (want === "nl" || want === "en") setLang(want);
  else if (!state.lang) setLang(/^nl\b/i.test(navigator.language || "") ? "nl" : "en");
  else setLang(state.lang);
  render(1);
}
window.claude?.hot?.snapshot?.(() => ({ state }));
const hot = window.claude?.hot;
if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});
</script>
</body></html>
